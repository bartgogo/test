name: dll_pack Windows CI

on:
  push:
    paths:
      - 'dll_pack/**'
      - '.github/workflows/dll-pack-windows.yml'
  pull_request:
    paths:
      - 'dll_pack/**'
      - '.github/workflows/dll-pack-windows.yml'

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and smoke test on Windows
        shell: cmd
        run: |
          set VSDEVCMD=
          for %%E in (Enterprise Professional Community BuildTools) do (
            if exist "C:\Program Files\Microsoft Visual Studio\2022\%%E\Common7\Tools\VsDevCmd.bat" (
              set VSDEVCMD=C:\Program Files\Microsoft Visual Studio\2022\%%E\Common7\Tools\VsDevCmd.bat
            )
          )
          if "%VSDEVCMD%"=="" exit /b 1
          call "%VSDEVCMD%" -arch=x64
          cd /d dll_pack
          build.bat
          cd /d dll_pack\build
          cl /nologo ..\src\test\test_program.c /Fe:test_program.exe
          cl /nologo ..\src\test\check_pe.c /Fe:check_pe.exe
          cl /nologo ..\src\test\check_aslr.c /Fe:check_aslr.exe
          packer.exe -in test_program.exe -out packed_test.exe -appid 450 -dll validator.dll
          if not exist packed_test.exe exit /b 1
          check_pe.exe packed_test.exe
          check_aslr.exe packed_test.exe
